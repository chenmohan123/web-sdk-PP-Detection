name: Release benchmarks

on:
  workflow_dispatch:
    inputs:
      run_validation:
        description: Run real-model browser benchmarks after stable assets are available
        required: true
        type: boolean
        default: false
      model_version:
        description: Candidate model version to validate
        required: true
        type: string
        default: "1.0.1"
      model_manifest_url:
        description: Optional immutable candidate manifest URL
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  wasm-fp32:
    if: inputs.run_validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run benchmark:parity
      - run: pnpm exec playwright test tests/browser/benchmark.spec.ts
        env:
          PPDETECTION_BENCHMARK_MODE: wasm-fp32
          PPDETECTION_MODEL_MANIFEST_URL: ${{ inputs.model_manifest_url || vars.PPDETECTION_MODEL_MANIFEST_URL }}
          PPDETECTION_MODEL_VERSION: ${{ inputs.model_version }}
          PPDETECTION_ACCEPTED_REFERENCE_PATH: tools/model-pipeline/references/picodet-l-320-official-output.json
          PPDETECTION_MODEL_SOURCE: ${{ vars.PPDETECTION_MODEL_SOURCE || 'huggingface' }}
          PPDETECTION_MODEL_VARIANT: fp32
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-wasm-fp32
          path: test-results/benchmark/wasm-fp32.json
          if-no-files-found: warn

  webgpu-fp16:
    if: inputs.run_validation && vars.PPDETECTION_MODEL_VARIANT == 'fp16'
    runs-on: [self-hosted, windows, x64, webgpu-hardware]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - run: pnpm exec playwright test tests/browser/benchmark.spec.ts
        env:
          PPDETECTION_BENCHMARK_MODE: webgpu-fp16
          PPDETECTION_MODEL_MANIFEST_URL: ${{ inputs.model_manifest_url || vars.PPDETECTION_MODEL_MANIFEST_URL }}
          PPDETECTION_MODEL_VERSION: ${{ inputs.model_version }}
          PPDETECTION_ACCEPTED_REFERENCE_PATH: tools/model-pipeline/references/picodet-l-320-official-output.json
          PPDETECTION_MODEL_SOURCE: ${{ vars.PPDETECTION_MODEL_SOURCE || 'huggingface' }}
          PPDETECTION_MODEL_VARIANT: fp16
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-webgpu-fp16
          path: test-results/benchmark/webgpu-fp16.json
          if-no-files-found: warn

  webgpu-fp32:
    if: inputs.run_validation && vars.PPDETECTION_MODEL_VARIANT == 'fp32'
    runs-on: [self-hosted, windows, x64, webgpu-hardware]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - run: pnpm exec playwright test tests/browser/benchmark.spec.ts
        env:
          PPDETECTION_BENCHMARK_MODE: webgpu-fp32
          PPDETECTION_MODEL_MANIFEST_URL: ${{ inputs.model_manifest_url || vars.PPDETECTION_MODEL_MANIFEST_URL }}
          PPDETECTION_MODEL_VERSION: ${{ inputs.model_version }}
          PPDETECTION_ACCEPTED_REFERENCE_PATH: tools/model-pipeline/references/picodet-l-320-official-output.json
          PPDETECTION_MODEL_SOURCE: ${{ vars.PPDETECTION_MODEL_SOURCE || 'huggingface' }}
          PPDETECTION_MODEL_VARIANT: fp32
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-webgpu-fp32
          path: test-results/benchmark/webgpu-fp32.json
          if-no-files-found: warn

  responsive-screenshots:
    if: inputs.run_validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter web-sdk-pp-detection build
      - run: pnpm --filter demo test
      - uses: actions/upload-artifact@v7
        with:
          name: responsive-screenshots
          path: apps/demo/test-results/**/*.png
