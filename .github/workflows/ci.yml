name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 下载固定来源模型用于仓库校验
        run: node scripts/fetch-model-source.mjs
        env:
          PPDETECTION_MODEL_MANIFEST_URL: ${{ vars.PPDETECTION_MODEL_MANIFEST_URL || 'https://huggingface.co/chenmohan/web-sdk-pp-detection/resolve/b089403d908b40f28e56e4c0330c3c8b6e71183f/manifest.json' }}
          PPDETECTION_MODEL_SOURCE: ${{ vars.PPDETECTION_MODEL_SOURCE || 'huggingface' }}
          PPDETECTION_MODEL_VARIANT: fp32
          PPDETECTION_MODEL_OUTPUT_DIR: models/pp-detection/1.0.1
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run verify
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: validate-playwright-diagnostics
          if-no-files-found: ignore
          path: |
            apps/demo/test-results
            test-results

  browser-wasm:
    name: Browser WASM and package smoke
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test tests/browser/runtime.spec.ts --grep "browser WASM"
      - run: pnpm exec playwright test tests/browser/package.spec.ts

  browser-webgpu-hardware:
    name: Browser WebGPU on physical GPU
    if: github.event_name == 'workflow_dispatch' && vars.RUN_WEBGPU_HARDWARE == 'true'
    runs-on: [self-hosted, windows, x64, webgpu-hardware]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - name: Run real FP32 WebGPU test on the tagged hardware runner
        run: pnpm exec playwright test tests/browser/runtime.spec.ts --grep "FP32 WebGPU"
        env:
          PPDETECTION_REAL_MODEL: "1"
          PPDETECTION_MODEL_MANIFEST_URL: ${{ vars.PPDETECTION_MODEL_MANIFEST_URL }}
          PPDETECTION_MODEL_SOURCE: ${{ vars.PPDETECTION_MODEL_SOURCE || 'huggingface' }}
          PPDETECTION_MODEL_VARIANT: fp32
