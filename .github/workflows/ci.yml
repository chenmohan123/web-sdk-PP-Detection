name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 下载固定来源模型用于仓库校验
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --directory "$GITHUB_WORKSPACE" >/tmp/pp-detection-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8765/models/pp-detection/manifest.json >/dev/null; then
              break
            fi
            sleep 1
          done
          node scripts/fetch-model-source.mjs
          cp "$RUNNER_TEMP/pp-detection-model/picodet-l-320-fp32.onnx" models/pp-detection/picodet-l-320-fp32.onnx
          accepted_model="$RUNNER_TEMP/picodet-l-320-fp32-1.0.0.onnx"
          curl --fail --location --retry 3 --output "$accepted_model" "https://media.githubusercontent.com/media/chenmohan123/web-sdk-PP-Detection/f7369860bffbb18a6b850987bab3943e1abb2b12/models/pp-detection/picodet-l-320-fp32.onnx"
          test "$(stat -c '%s' "$accepted_model")" = "23243834"
          echo "0397bb449689d1bf57dfcb8849b3ddaa1c8962e1e63e533bd97d265908a428a1  $accepted_model" | sha256sum --check --status
          cp "$accepted_model" models/pp-detection/picodet-l-320-fp32.onnx
        env:
          PPDETECTION_MODEL_MANIFEST_URL: http://127.0.0.1:8765/models/pp-detection/manifest.json
          PPDETECTION_MODEL_SOURCE: git-lfs
          PPDETECTION_MODEL_VARIANT: fp32
          PPDETECTION_MODEL_OUTPUT_DIR: ${{ runner.temp }}/pp-detection-model
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run verify
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: validate-playwright-diagnostics
          if-no-files-found: ignore
          path: |
            apps/demo/test-results
            test-results

  browser-wasm:
    name: Browser WASM and package smoke
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test tests/browser/runtime.spec.ts --grep "browser WASM"
      - run: pnpm exec playwright test tests/browser/package.spec.ts

  browser-webgpu-hardware:
    name: Browser WebGPU on physical GPU
    if: github.event_name == 'workflow_dispatch' && vars.RUN_WEBGPU_HARDWARE == 'true'
    runs-on: [self-hosted, windows, x64, webgpu-hardware]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - name: Run real FP32 WebGPU test on the tagged hardware runner
        run: pnpm exec playwright test tests/browser/runtime.spec.ts --grep "FP32 WebGPU"
        env:
          PPDETECTION_REAL_MODEL: "1"
          PPDETECTION_MODEL_MANIFEST_URL: ${{ vars.PPDETECTION_MODEL_MANIFEST_URL }}
          PPDETECTION_MODEL_SOURCE: ${{ vars.PPDETECTION_MODEL_SOURCE || 'huggingface' }}
          PPDETECTION_MODEL_VARIANT: fp32
