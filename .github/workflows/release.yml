name: npm release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: false
      - name: Require the release tag to be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: 下载固定来源模型用于发布校验
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --directory "$GITHUB_WORKSPACE" >/tmp/pp-detection-release-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8765/models/pp-detection/1.0.1/manifest.json >/dev/null; then
              break
            fi
            sleep 1
          done
          node scripts/fetch-model-source.mjs
          cp "$RUNNER_TEMP/pp-detection-model/picodet-l-320-fp32.onnx" models/pp-detection/1.0.1/picodet-l-320-fp32.onnx
          accepted_model="$RUNNER_TEMP/picodet-l-320-fp32-1.0.0.onnx"
          curl --fail --location --retry 3 --output "$accepted_model" "https://media.githubusercontent.com/media/chenmohan123/web-sdk-PP-Detection/50ec35925ca89945dcfc4d13935e65bf054ac741/models/pp-detection/1.0.0/picodet-l-320-fp32.onnx"
          test "$(stat -c '%s' "$accepted_model")" = "23219047"
          echo "a7e1fbfe20f07fd7a7567811a4e2670df0595f0fecb885505d7d93466990e982  $accepted_model" | sha256sum --check --status
          cp "$accepted_model" models/pp-detection/1.0.0/picodet-l-320-fp32.onnx
        env:
          PPDETECTION_MODEL_MANIFEST_URL: http://127.0.0.1:8765/models/pp-detection/1.0.1/manifest.json
          PPDETECTION_MODEL_SOURCE: git-lfs
          PPDETECTION_MODEL_VARIANT: fp32
          PPDETECTION_MODEL_OUTPUT_DIR: ${{ runner.temp }}/pp-detection-model
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify tag, package, models, workspace, and packed package
        run: node scripts/verify-release.mjs --release "${GITHUB_REF_NAME}"
      - name: Publish with npm provenance
        working-directory: packages/sdk
        run: npm publish --access public --provenance
      - name: Record published integrity
        shell: bash
        run: |
          set -o pipefail
          package="web-sdk-pp-detection@${GITHUB_REF_NAME#v}"
          for attempt in {1..20}; do
            if metadata="$(npm view "$package" version dist.integrity --json)"; then
              {
                echo '## npm integrity'
                echo "$metadata"
              } | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if (( attempt < 20 )); then
              echo "npm registry has not exposed $package yet; retrying in 6 seconds..." >&2
              sleep 6
            fi
          done
          echo "Failed to read published integrity for $package after 20 attempts." >&2
          exit 1
