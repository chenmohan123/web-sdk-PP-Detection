name: npm release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: false
      - name: Require the release tag to be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: 下载固定来源模型用于发布校验
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --directory "$GITHUB_WORKSPACE" >/tmp/pp-detection-release-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8765/models/pp-detection/manifest.json >/dev/null; then
              break
            fi
            sleep 1
          done
          node scripts/fetch-model-source.mjs
          cp "$RUNNER_TEMP/pp-detection-model/picodet-l-320-fp32.onnx" models/pp-detection/picodet-l-320-fp32.onnx
          accepted_model="$RUNNER_TEMP/picodet-l-320-fp32.onnx"
          curl --fail --location --retry 3 --output "$accepted_model" "https://media.githubusercontent.com/media/chenmohan123/web-sdk-PP-Detection/main/models/pp-detection/picodet-l-320-fp32.onnx"
          test "$(stat -c '%s' "$accepted_model")" = "23243834"
          echo "0397bb449689d1bf57dfcb8849b3ddaa1c8962e1e63e533bd97d265908a428a1  $accepted_model" | sha256sum --check --status
          cp "$accepted_model" models/pp-detection/picodet-l-320-fp32.onnx
        env:
          PPDETECTION_MODEL_MANIFEST_URL: http://127.0.0.1:8765/models/pp-detection/manifest.json
          PPDETECTION_MODEL_SOURCE: git-lfs
          PPDETECTION_MODEL_VARIANT: fp32
          PPDETECTION_MODEL_OUTPUT_DIR: ${{ runner.temp }}/pp-detection-model
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify tag, package, models, workspace, and packed package
        run: node scripts/verify-release.mjs --release "${GITHUB_REF_NAME}"
      - name: Publish with npm provenance
        working-directory: packages/sdk
        run: npm publish --access public --provenance
      - name: Record published integrity
        timeout-minutes: 12
        run: node scripts/wait-npm-publication.mjs web-sdk-pp-detection "${GITHUB_REF_NAME#v}" "$RUNNER_TEMP/npm-publication.json"
      - name: 保存 npm 发布等待记录
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-publication
          if-no-files-found: ignore
          path: ${{ runner.temp }}/npm-publication.json
