<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PP-Detection CDN 示例</title>
    <style>
      body {
        max-width: 760px;
        margin: 32px auto;
        padding: 0 16px;
        font: 16px/1.6 system-ui;
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      button {
        margin: 8px;
      }
      progress {
        display: block;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <h1>PP-Detection CDN 示例</h1>
    <p>SDK 0.1.1，默认从 ModelScope 加载官方 PicoDet 模型。图片仅在当前浏览器处理。</p>
    <input id="image" type="file" accept="image/*" /><button id="detect">检测</button>
    <p id="status">请选择图片</p>
    <progress id="progress" max="100" value="0"></progress>
    <pre id="output"></pre>
    <script src="https://cdn.jsdelivr.net/npm/web-sdk-pp-detection@0.1.1/dist/browser-global.js"></script>
    <script>
      const { createPPDetection, PPDetectionError } = window.PPDetection;

      const manifestUrl =
        "https://www.modelscope.cn/models/chenmohan/web-sdk-pp-detection/resolve/master/manifest.json?v=1.0.1";
      const image = document.querySelector("#image");
      const status = document.querySelector("#status");
      const progress = document.querySelector("#progress");
      const output = document.querySelector("#output");
      const button = document.querySelector("#detect");
      const cancel = document.createElement("button");
      cancel.textContent = "取消";
      cancel.disabled = true;
      button.after(cancel);
      let controller;
      let mounted = true;
      cancel.addEventListener("click", () => controller?.abort());
      window.addEventListener("pagehide", () => {
        mounted = false;
        controller?.abort();
      });
      window.addEventListener("pageshow", () => {
        mounted = true;
      });

      button.addEventListener("click", async () => {
        const file = image.files?.[0];
        if (!file || controller) return;
        const operation = new AbortController();
        controller = operation;
        button.disabled = image.disabled = true;
        cancel.disabled = false;
        output.textContent = "";
        let detector;
        const current = () => mounted && !operation.signal.aborted;
        try {
          detector = await createPPDetection({
            model: manifestUrl,
            source: "modelscope",
            backend: "auto",
            allowFallback: true,
            executionMode: "main",
            signal: operation.signal,
            ort: { wasm: { paths: "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.27.0/dist/" } },
            onProgress: (event) => {
              if (!current()) return;
              status.textContent = `${event.phase}: ${event.status}`;
              if (event.totalBytes)
                progress.value = ((event.loadedBytes ?? 0) / event.totalBytes) * 100;
            }
          });
          if (!current()) return;
          const result = await detector.detect(file, { threshold: 0.5, signal: operation.signal });
          if (!current()) return;
          progress.value = 100;
          status.textContent = `检测完成：${result.detections.length} 个目标`;
          output.textContent = JSON.stringify(result, null, 2);
        } catch (error) {
          if (current())
            output.textContent = JSON.stringify(
              error instanceof PPDetectionError
                ? { code: error.code, message: error.message, details: error.details }
                : { message: String(error) },
              null,
              2
            );
        } finally {
          // 未能中止的初始化也必须等待完成后释放迟到实例。
          try {
            await detector?.dispose();
          } finally {
            controller = undefined;
            button.disabled = image.disabled = false;
            cancel.disabled = true;
            if (mounted && operation.signal.aborted) status.textContent = "已取消并释放模型";
          }
        }
      });
    </script>
  </body>
</html>
