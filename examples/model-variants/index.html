<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PP-Detection 六变体示例</title>
    <style>
      /* 颜色、圆角与焦点值来自门户 standards/v1/ui-tokens.json v1.0.0。 */
      :root {
        color: #0f172a;
        background: #f8fafc;
        font-family: system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      main {
        width: min(1040px, calc(100% - 32px));
        margin: 32px auto;
      }
      h1 {
        margin: 0 0 20px;
        font-size: 28px;
      }
      .controls {
        display: grid;
        grid-template-columns: repeat(3, minmax(150px, 1fr));
        gap: 12px;
        padding: 16px 0;
        border-block: 1px solid #cbd5e1;
      }
      label {
        display: grid;
        gap: 6px;
        font-size: 14px;
        font-weight: 600;
      }
      select,
      input,
      button {
        min-height: 40px;
        font: inherit;
      }
      select,
      input[type="file"] {
        width: 100%;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 16px 0;
      }
      button {
        border: 1px solid #2563eb;
        border-radius: 8px;
        padding: 0 16px;
        color: #ffffff;
        background: #2563eb;
        cursor: pointer;
      }
      button.secondary {
        color: #2563eb;
        background: transparent;
      }
      button:disabled {
        cursor: default;
        opacity: 0.5;
      }
      progress {
        width: 100%;
        height: 12px;
      }
      canvas[hidden] {
        display: none;
      }
      :focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.28);
      }
      canvas {
        display: block;
        max-width: 100%;
        margin-top: 20px;
        border: 1px solid #cbd5e1;
        background: #ffffff;
      }
      pre {
        min-height: 80px;
        overflow: auto;
        padding: 12px;
        border-left: 3px solid #2563eb;
        background: #ffffff;
        white-space: pre-wrap;
      }
      @media (max-width: 680px) {
        .controls {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>PP-Detection 六变体</h1>
      <div class="controls">
        <label
          >模型
          <select id="model">
            <option value="picodet">PicoDet-L-320 1.0.2</option>
            <option value="ppyoloe">PP-YOLOE+ S 640 0.1.1</option>
          </select>
        </label>
        <label
          >来源
          <select id="source">
            <option value="modelscope">ModelScope</option>
            <option value="huggingface">Hugging Face</option>
          </select>
        </label>
        <label
          >精度
          <select id="precision">
            <option value="fp32">FP32</option>
            <option value="fp16">FP16</option>
            <option value="w8a32">W8A32</option>
          </select>
        </label>
      </div>
      <div class="actions">
        <input id="image" type="file" accept="image/*" />
        <button id="detect" type="button">检测</button>
        <button id="cancel" class="secondary" type="button" disabled>取消</button>
      </div>
      <p id="status">请选择图片</p>
      <progress id="progress" max="100" value="0"></progress>
      <canvas id="preview" hidden></canvas>
      <pre id="output"></pre>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
