<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PP-Detection Vanilla DOM 示例</title>
    <style>
      body {
        max-width: 760px;
        margin: 32px auto;
        padding: 0 16px;
        font: 16px/1.6 system-ui;
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      button {
        margin: 8px;
      }
      progress {
        display: block;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <h1>PP-Detection Vanilla DOM 示例</h1>
    <p>SDK 0.2.0，默认从 ModelScope 加载官方 PicoDet 模型。图片仅在当前浏览器处理。</p>
    <input id="image" type="file" accept="image/*" /><button id="detect">检测</button>
    <p id="status">请选择图片</p>
    <progress id="progress" max="100" value="0"></progress>
    <pre id="output"></pre>
    <script src="https://cdn.jsdelivr.net/npm/web-sdk-pp-detection@0.2.0/dist/browser-global.js"></script>
    <script src="./main.js"></script>
  </body>
</html>
