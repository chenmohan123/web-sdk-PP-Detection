schemaVersion: "1.1.0"
id: pp-detection
name: PaddleDetection Web SDK
summary: 在浏览器本地运行 PaddleDetection 轴对齐目标检测模型，支持图片、摄像头帧和视频帧。
package:
  name: web-sdk-pp-detection
  version: 0.1.1
repository: https://github.com/chenmohan123/web-sdk-PP-Detection
demo:
  url: https://chenmohan123.github.io/web-sdk-PP-Detection/
  defaultLanguage: zh-CN
  framework: react
  localProcessing: true
docs:
  zhCN: docs/zh-CN/quick-start.md
  en: docs/en/quick-start.md
runtime:
  backends: [wasm, webgpu]
  executionModes: [main, worker]
  actualBackendReported: true
  runtimeVersion: onnxruntime-web@1.27.0
model:
  id: pp-picodet-l-320
  version: 1.0.1
  format: onnx
  parameterCount: 5787988
  precision: [fp32]
  source: PaddleDetection release/2.9 PicoDet-L-320 LCNet 后处理 ONNX 清理产物；Git LFS、Hugging Face 和 ModelScope 均固定到不可变 revision。
  license: Apache-2.0（依据 PaddleDetection 官方模型说明）
  assets:
    - id: fp32
      bytes: 23243834
      precision: fp32
      url: https://huggingface.co/chenmohan/web-sdk-pp-detection/resolve/main/picodet-l-320-fp32.onnx?v=1.0.1
      sha256: 0397bb449689d1bf57dfcb8849b3ddaa1c8962e1e63e533bd97d265908a428a1
  defaultVariant: fp32
  defaultSource: huggingface
performance:
  timings:
    [
      modelDownloadMs,
      modelCacheReadMs,
      integrityMs,
      sessionMs,
      preprocessMs,
      inferenceMs,
      postprocessMs,
      totalMs
    ]
  coldStartDefined: true
  warmRunDefined: true
cache:
  storage: [indexeddb, memory]
  versionedKeys: true
  clearCurrent: true
  clearAll: true
  estimate: true
examples:
  vanilla: { status: available, path: examples/vanilla }
  react: { status: available, path: examples/react }
  vite: { status: available, path: examples/vanilla-vite }
  cdn: { status: available, path: examples/cdn }
  wechatWebView: { status: available, path: examples/wechat-webview }
verification:
  environments:
    - browser: Chromium 151.0.7922.34
      os: Linux 6.17.0-1022-azure
      device: GitHub Actions Linux runner
      testedAt: 2026-08-30
      backend: wasm
      runtimeVersion: onnxruntime-web@1.27.0
    - browser: Chromium 151.0.7922.174
      os: Windows 10.0.26200
      device: NVIDIA Blackwell
      testedAt: 2026-08-30
      backend: webgpu
      runtimeVersion: onnxruntime-web@1.27.0
